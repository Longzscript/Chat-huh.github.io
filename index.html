<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>CHAT</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #f0f2f5;
}

/* =========================
   LOGIN
========================= */

#lockScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #eef3f8;
}

.login-box {
    width: min(380px, 90%);
    padding: 35px;

    background: white;
    border-radius: 18px;

    box-shadow: 0 15px 50px rgba(0,0,0,.12);

    text-align: center;

    animation: loginIn .45s ease;
}

.login-box h1 {
    color: #0068ff;
    font-size: 30px;
    margin-bottom: 8px;
}

.login-box p {
    color: #777;
    margin-bottom: 24px;
}

.login-box input {
    width: 100%;

    padding: 14px;

    border: 1px solid #ddd;
    border-radius: 10px;

    outline: none;

    font-size: 16px;

    margin-bottom: 12px;
}

.login-box input:focus {
    border-color: #0068ff;
}

.login-box button {
    width: 100%;

    padding: 14px;

    border: none;
    border-radius: 10px;

    background: #0068ff;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.login-box button:hover {
    background: #0054d6;
}

#error {
    min-height: 20px;
    margin-top: 10px;
    color: #e53935;
}

/* =========================
   APP
========================= */

#app {
    display: none;

    width: 100%;
    height: 100dvh;

    flex-direction: column;

    animation: appIn .3s ease;
}

/* =========================
   HEADER
========================= */

.header {
    height: 64px;
    min-height: 64px;

    display: flex;
    align-items: center;

    padding: 0 18px;

    background: white;

    border-bottom: 1px solid #ddd;

    position: relative;
    z-index: 5;
}

.logo {
    color: #0068ff;

    font-size: 24px;
    font-weight: bold;
}

.status {
    margin-left: 12px;

    font-size: 12px;

    color: #777;
}

.status::before {
    content: "";

    display: inline-block;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #31c45b;

    margin-right: 5px;
}

/* =========================
   MESSAGES
========================= */

.messages {
    flex: 1;

    width: 100%;

    overflow-y: auto;

    padding: 20px;

    background: #f0f2f5;

    scroll-behavior: smooth;
}

.message {
    width: 100%;

    display: flex;

    margin-bottom: 10px;

    animation: messageIn .22s ease;
}

.message.me {
    justify-content: flex-end;
}

.bubble {
    max-width: min(70%, 700px);

    padding: 10px 14px;

    background: white;

    border-radius: 17px 17px 17px 5px;

    box-shadow: 0 1px 2px rgba(0,0,0,.08);

    word-break: break-word;

    line-height: 1.45;
}

.message.me .bubble {
    background: #0068ff;
    color: white;

    border-radius: 17px 17px 5px 17px;
}

/* LINK */

.bubble a {
    color: #0068ff;

    text-decoration: underline;

    word-break: break-all;
}

.message.me .bubble a {
    color: #dcecff;
}

/* IMAGE */

.message-image {
    display: block;

    max-width: min(420px, 70vw);
    max-height: 500px;

    border-radius: 12px;

    object-fit: contain;

    cursor: pointer;

    transition: transform .2s;
}

.message-image:hover {
    transform: scale(1.015);
}

.time {
    margin-top: 4px;

    font-size: 10px;

    opacity: .55;
}

/* =========================
   INPUT
========================= */

.input-area {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 10px 12px;

    background: white;

    border-top: 1px solid #ddd;

    padding-bottom:
        max(10px, env(safe-area-inset-bottom));
}

/* IMAGE BUTTON */

.image-button {
    width: 44px;
    height: 44px;

    flex-shrink: 0;

    border: none;

    border-radius: 50%;

    background: #f1f3f5;

    color: #0068ff;

    font-size: 21px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        background .2s,
        transform .15s;
}

.image-button:hover {
    background: #e3e8ef;
}

.image-button:active {
    transform: scale(.9);
}

#imageInput {
    display: none;
}

/* TEXT */

#messageInput {
    flex: 1;

    min-width: 0;

    height: 44px;

    border: none;

    outline: none;

    background: #f1f3f5;

    border-radius: 23px;

    padding: 0 17px;

    font-size: 15px;
}

/* SEND */

.send {
    height: 44px;

    padding: 0 19px;

    border: none;

    border-radius: 23px;

    background: #0068ff;

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition:
        background .2s,
        transform .15s;
}

.send:hover {
    background: #0054d6;
}

.send:active {
    transform: scale(.94);
}

/* =========================
   EMPTY
========================= */

.empty {
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #999;

    font-size: 14px;
}

/* =========================
   ANIMATION
========================= */

@keyframes loginIn {

    from {
        opacity: 0;
        transform: translateY(20px) scale(.95);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}

@keyframes appIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(8px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .header {
        height: 58px;
        min-height: 58px;

        padding: 0 14px;
    }

    .logo {
        font-size: 21px;
    }

    .messages {
        padding: 12px 10px;
    }

    .bubble {
        max-width: 82%;
    }

    .message-image {
        max-width: 75vw;
        max-height: 55vh;
    }

    .input-area {
        padding-left: 8px;
        padding-right: 8px;
    }

    .image-button {
        width: 42px;
        height: 42px;
    }

    .send {
        padding: 0 15px;
    }

    #messageInput {
        height: 42px;
    }

}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:380px) {

    .status {
        display: none;
    }

    .send {
        font-size: 0;

        width: 42px;
        padding: 0;
    }

    .send::after {
        content: ">";
        font-size: 18px;
    }

}
</style>
</head>

<body>

<!-- =========================
     PASSWORD
========================= -->

<div id="lockScreen">

    <div class="login-box">

        <h1>CHAT</h1>

        <p>Nhập mật khẩu để tiếp tục</p>

        <input
            id="password"
            type="password"
            placeholder="Mật khẩu"
            autocomplete="off"
        >

        <button onclick="login()">
            Đăng nhập
        </button>

        <div id="error"></div>

    </div>

</div>


<!-- =========================
     CHAT
========================= -->

<div id="app">

    <header class="header">

        <div class="logo">
            CHAT
        </div>

        <div class="status">
            Đang hoạt động
        </div>

    </header>


    <main
        id="messages"
        class="messages">
    </main>


    <div class="input-area">

        <!-- IMAGE -->

        <button
            class="image-button"
            onclick="document.getElementById('imageInput').click()"
            title="Tải ảnh lên">
            +
        </button>

        <input
            id="imageInput"
            type="file"
            accept="image/*"
            onchange="sendImage(event)"
        >


        <!-- MESSAGE -->

        <input
            id="messageInput"
            type="text"
            placeholder="Nhập tin nhắn..."
            autocomplete="off"
        >


        <!-- SEND -->

        <button
            class="send"
            onclick="sendMessage()">
            Gửi
        </button>

    </div>

</div>


<script>

/* =========================
   CONFIG
========================= */

const WEB_PASSWORD = "132";

// Message Vault API configuration
const API_BASE = "https://3000-ifu1rod8szpdhabai9xmp-420865d3.sg2.manus.computer";
const API_KEY = "mv_live_k2PEXu4XW2SOTo09BkadBWLydnBBdtvs";
// Optional: set a slug to pin this chat to one room. Empty = use the first room.
const ROOM_SLUG = "";
let activeRoomSlug = ROOM_SLUG;
const API_ENABLED = true;
const STORAGE_KEY = "CHAT_MESSAGES_SINGLE_CACHE";


/* =========================
   DATA
========================= */

let messages =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    ) || [];

function setStatus(text, isError = false) {
    const status = document.querySelector(".status");
    if (!status) return;
    status.textContent = text;
    status.style.color = isError ? "#e53935" : "#777";
}

async function apiRequest(path, options = {}) {
    const response = await fetch(API_BASE + path, {
        ...options,
        headers: {
            "Content-Type": "application/json",
            "X-API-Key": API_KEY,
            ...(options.headers || {})
        }
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok || data.ok === false) {
        throw new Error(data.error || "API request failed");
    }
    return data;
}

function messageFromApi(message) {
    const imageUrl = message.imageUrl
        ? (message.imageUrl.startsWith("http") ? message.imageUrl : API_BASE + message.imageUrl)
        : "";
    return {
        type: imageUrl ? "image" : "text",
        text: message.content || "",
        src: imageUrl,
        me: message.sender === "check.html",
        time: new Date(message.createdAt).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })
    };
}

async function loadFromApi() {
    try {
        setStatus("Đang đồng bộ...");
        if (!activeRoomSlug) {
            const roomsData = await apiRequest("/api/v1/rooms", { method: "GET" });
            activeRoomSlug = roomsData.rooms?.[0]?.slug || "";
        }
        if (!activeRoomSlug) {
            setStatus("Chưa có phòng", true);
            renderMessages();
            return;
        }
        const data = await apiRequest("/api/v1/rooms/" + encodeURIComponent(activeRoomSlug) + "/messages?limit=100", { method: "GET" });
        messages = (data.messages || []).map(messageFromApi);
        save();
        renderMessages();
        setStatus("Đã đồng bộ API");
    } catch (error) {
        setStatus("API lỗi - đang dùng cache", true);
        console.error("Message Vault API:", error);
        renderMessages();
    }
}


/* =========================
   LOGIN
========================= */

function login() {

    const password =
        document.getElementById("password").value;

    if (password === WEB_PASSWORD) {

        document.getElementById("lockScreen")
            .style.display = "none";

        document.getElementById("app")
            .style.display = "flex";

        renderMessages();

        setTimeout(() => {

            document
                .getElementById("messageInput")
                .focus();

        }, 100);

    } else {

        document.getElementById("error")
            .textContent =
            "Mật khẩu không đúng";

        document.getElementById("password")
            .value = "";

    }

}


/* ENTER LOGIN */

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                login();
            }

        }
    );


/* =========================
   SAVE
========================= */

function save() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(messages)
    );

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   LINK FORMAT
========================= */

function formatText(text) {

    let safe =
        escapeHTML(text);

    const regex =
        /(https?:\/\/[^\s<]+)/gi;

    return safe
        .replace(
            regex,
            url => {

                return `
                    <a
                        href="${url}"
                        target="_blank"
                        rel="noopener noreferrer">
                        ${url}
                    </a>
                `;

            }
        )
        .replace(/\n/g, "<br>");

}


/* =========================
   TIME
========================= */

function getTime() {

    return new Date()
        .toLocaleTimeString(
            "vi-VN",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

}


/* =========================
   SEND TEXT
========================= */

async function sendMessage() {

    if (API_ENABLED && !activeRoomSlug) {
        await loadFromApi();
        if (!activeRoomSlug) return;
    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if (!text) return;

    input.value = "";

    if (API_ENABLED) {
        try {
            setStatus("Đang gửi...");
            const data = await apiRequest("/api/v1/rooms/" + encodeURIComponent(activeRoomSlug) + "/messages", {
                method: "POST",
                body: JSON.stringify({ content: text, sender: "check.html" })
            });
            messages.push(messageFromApi(data.message));
            save();
            renderMessages();
            setStatus("Đã đồng bộ API");
            return;
        } catch (error) {
            console.error("Message Vault API:", error);
            setStatus("API lỗi - đã lưu tạm", true);
        }
    }

    messages.push({ type: "text", text, me: true, time: getTime() });
    save();
    renderMessages();

}


/* =========================
   SEND IMAGE
========================= */

function sendImage(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {

        alert("Vui lòng chọn file ảnh.");

        return;

    }

    /*
       Giới hạn để tránh localStorage
       bị đầy quá nhanh.
    */

    if (file.size > 5 * 1024 * 1024) {

        alert(
            "Ảnh tối đa 5MB."
        );

        event.target.value = "";

        return;

    }

    const reader =
        new FileReader();

    reader.onload = async function(e) {
        if (API_ENABLED && !activeRoomSlug) {
            await loadFromApi();
            if (!activeRoomSlug) return;
        }

        if (API_ENABLED) {
            try {
                setStatus("Đang tải ảnh...");
                const data = await apiRequest("/api/v1/rooms/" + encodeURIComponent(activeRoomSlug) + "/messages", {
                    method: "POST",
                    body: JSON.stringify({
                        imageData: e.target.result,
                        imageName: file.name,
                        sender: "check.html"
                    })
                });
                messages.push(messageFromApi(data.message));
                save();
                renderMessages();
                setStatus("Đã đồng bộ API");
                return;
            } catch (error) {
                console.error("Message Vault API:", error);
                setStatus("API lỗi - đã lưu tạm", true);
            }
        }

        messages.push({ type: "image", src: e.target.result, me: true, time: getTime() });
        save();
        renderMessages();

    };

    reader.readAsDataURL(file);

    event.target.value = "";

}


/* =========================
   RENDER
========================= */

function renderMessages() {

    const box =
        document.getElementById(
            "messages"
        );

    box.innerHTML = "";

    if (messages.length === 0) {

        box.innerHTML = `
            <div class="empty">
                Chưa có tin nhắn
            </div>
        `;

        return;

    }

    messages.forEach(message => {

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message " +
            (message.me ? "me" : "");


        let content = "";


        /* TEXT */

        if (message.type === "text") {

            content =
                formatText(message.text);

        }


        /* IMAGE */

        if (message.type === "image") {

            content = `
                <img
                    class="message-image"
                    src="${message.src}"
                    alt="Ảnh"
                    onclick="openImage(this.src)"
                >
            `;

        }


        wrapper.innerHTML = `

            <div class="bubble">

                ${content}

                <div class="time">
                    ${message.time}
                </div>

            </div>

        `;

        box.appendChild(wrapper);

    });


    requestAnimationFrame(() => {

        box.scrollTop =
            box.scrollHeight;

    });

}


/* =========================
   OPEN IMAGE
========================= */

function openImage(src) {

    const win =
        window.open();

    if (win) {

        win.document.write(`
            <title>Ảnh</title>

            <style>
                body {
                    margin: 0;
                    background: #000;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    min-height: 100vh;
                }

                img {
                    max-width: 100%;
                    max-height: 100vh;
                    object-fit: contain;
                }
            </style>

            <img src="${src}">
        `);

    }

}


/* =========================
   ENTER SEND
========================= */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* =========================
   START
========================= */

renderMessages();
loadFromApi();

</script>

</body>
</html>
